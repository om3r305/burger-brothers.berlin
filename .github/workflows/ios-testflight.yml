name: iOS TestFlight - Main Schnell Driver

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which iOS app?"
        required: true
        type: choice
        options:
          - main
          - schnell
          - driver
      upload:
        description: "Upload IPA to App Store Connect/TestFlight"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  archive:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select app
        shell: bash
        env:
          APP_CHOICE: ${{ inputs.app }}
          MAIN_PROFILE: ${{ secrets.IOS_MAIN_PROVISIONING_PROFILE_BASE64 }}
          SCHNELL_PROFILE: ${{ secrets.IOS_SCHNELL_PROVISIONING_PROFILE_BASE64 }}
          DRIVER_PROFILE: ${{ secrets.IOS_DRIVER_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          case "$APP_CHOICE" in
            main)
              echo "PROJECT_DIR=ios/BurgerBrothersMain" >> "$GITHUB_ENV"
              echo "PROJECT=BurgerBrothersMain.xcodeproj" >> "$GITHUB_ENV"
              echo "SCHEME=BurgerBrothersMain" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=berlin.burgerbrothers.app" >> "$GITHUB_ENV"
              echo "PROFILE_B64=$MAIN_PROFILE" >> "$GITHUB_ENV"
              ;;
            schnell)
              echo "PROJECT_DIR=ios/BurgerBrothersSchnell" >> "$GITHUB_ENV"
              echo "PROJECT=BurgerBrothersSchnell.xcodeproj" >> "$GITHUB_ENV"
              echo "SCHEME=BurgerBrothersSchnell" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=berlin.burgerbrothers.schnell" >> "$GITHUB_ENV"
              echo "PROFILE_B64=$SCHNELL_PROFILE" >> "$GITHUB_ENV"
              ;;
            driver)
              echo "PROJECT_DIR=ios/BurgerBrothersDriver" >> "$GITHUB_ENV"
              echo "PROJECT=BurgerBrothersDriver.xcodeproj" >> "$GITHUB_ENV"
              echo "SCHEME=BurgerBrothersDriver" >> "$GITHUB_ENV"
              echo "BUNDLE_ID=berlin.burgerbrothers.driver" >> "$GITHUB_ENV"
              echo "PROFILE_B64=$DRIVER_PROFILE" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Check secrets
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          for value in APPLE_TEAM_ID CERT_B64 CERT_PASSWORD API_KEY_ID API_ISSUER_ID API_KEY_P8_B64 PROFILE_B64; do
            test -n "${!value}" || { echo "::error::$value is missing"; exit 1; }
          done

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import distribution certificate
        shell: bash
        env:
          CERT_B64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(openssl rand -hex 20)"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12"             -k build.keychain -P "$CERT_PASSWORD"             -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s build.keychain
          security set-key-partition-list             -S apple-tool:,apple:,codesign: -s             -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Install selected provisioning profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Install App Store Connect API key
        shell: bash
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_KEY_P8_B64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY_P8_B64" | base64 --decode             > "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8"

      - name: Generate Xcode project
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Archive
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild             -project "$PROJECT"             -scheme "$SCHEME"             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -archivePath "$RUNNER_TEMP/BurgerBrothers.xcarchive"             DEVELOPMENT_TEAM="$APPLE_TEAM_ID"             CODE_SIGN_STYLE=Manual             CODE_SIGN_IDENTITY="Apple Distribution"             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"             archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF

          xcodebuild             -exportArchive             -archivePath "$RUNNER_TEMP/BurgerBrothers.xcarchive"             -exportPath "$RUNNER_TEMP/export"             -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: BurgerBrothers-${{ inputs.app }}-iOS
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          xcrun altool             --upload-app             --type ios             --file "$IPA"             --apiKey "$API_KEY_ID"             --apiIssuer "$API_ISSUER_ID"

      - name: Cleanup
        if: always()
        run: security delete-keychain build.keychain || true
