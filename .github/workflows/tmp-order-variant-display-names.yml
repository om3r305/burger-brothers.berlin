name: Temporary order variant display name patch

on:
  push:
    branches:
      - fix/order-variant-display-names

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused canonical display-name patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path("lib/server/order-pricing.ts")
          text = path.read_text(encoding="utf-8")
          old = "        name: fullName,\n"
          new = "        // Keep group-qualified names only as lookup aliases; customer/TV/print display uses the selected variant itself.\n        name: variantName,\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one grouped variant display name, found {count}")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -F 'name: variantName,' lib/server/order-pricing.ts
          grep -F 'fullName,' lib/server/order-pricing.ts

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-order-variant-display-names.yml
          git add lib/server/order-pricing.ts
          git commit -m "fix(orders): hide variant group prefixes in item names"
          git push origin HEAD:fix/order-variant-display-names
