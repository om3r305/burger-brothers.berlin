name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/burger-studio-v1'
        with:
          ref: codex/burger-studio-v1
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request' || github.head_ref != 'codex/burger-studio-v1'
      - name: Apply Burger Studio integration
        if: github.event_name == 'pull_request' && github.head_ref == 'codex/burger-studio-v1'
        run: python3 scripts/apply-burger-studio.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run artifact:check
      - run: npm run typecheck
      - run: npm run hardening:test
      - run: npm run performance:test
      - run: npm run security:test
      - run: npm run showcase:test
      - run: npm run schnell:test
      - run: npm run notifications:test
      - run: npm run brian:test
      - run: npm run release:test
      - run: npm run regression:test:all
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Finalize Burger Studio branch
        if: success() && github.event_name == 'pull_request' && github.head_ref == 'codex/burger-studio-v1'
        run: |
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          rm -f scripts/apply-burger-studio.py
          rm -f .github/workflows/burger-studio-apply.yml
          git config user.name "burger-brothers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Burger Studio integration changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate Burger Studio ordering flow"
          git push origin HEAD:codex/burger-studio-v1
