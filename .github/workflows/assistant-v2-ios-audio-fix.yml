name: Assistant V2 iOS Audio Fix

on:
  push:
    branches:
      - fix/ai-v2-natural-realtime

permissions:
  contents: write

concurrency:
  group: assistant-v2-ios-audio-fix
  cancel-in-progress: false

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch iPhone realtime audio playback
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          p = Path('components/assistant/BurgerAssistant.tsx')
          s = p.read_text()

          def replace_once(old: str, new: str, label: str):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              '  const [voiceError, setVoiceError] = useState("");\n  const [voiceLevel, setVoiceLevel] = useState(0);\n  const [voiceConfirmation, setVoiceConfirmation] = useState("");',
              '  const [voiceError, setVoiceError] = useState("");\n  const [voiceConfirmation, setVoiceConfirmation] = useState("");',
              'voice level state',
          )

          replace_once(
              '  const pendingVoiceCheckoutRef = useRef(false);\n  const voiceIdleTimerRef = useRef<number | null>(null);\n  const meterFrameRef = useRef<number | null>(null);\n  const meterContextRef = useRef<AudioContext | null>(null);',
              '  const pendingVoiceCheckoutRef = useRef(false);\n  const voiceIdleTimerRef = useRef<number | null>(null);\n  const voiceSpeakingRef = useRef(false);',
              'voice refs',
          )

          replace_once(
              '    if (meterFrameRef.current != null) cancelAnimationFrame(meterFrameRef.current);\n    meterFrameRef.current = null;\n    void meterContextRef.current?.close();\n    meterContextRef.current = null;\n    setVoiceLevel(0);\n\n',
              '',
              'meter cleanup',
          )

          replace_once(
              '    if (remoteAudioRef.current) {\n      try {\n        remoteAudioRef.current.pause();\n        remoteAudioRef.current.srcObject = null;\n      } catch {}\n    }\n    remoteAudioRef.current = null;\n\n    setVoiceState("idle");',
              '    voiceSpeakingRef.current = false;\n\n    if (remoteAudioRef.current) {\n      try {\n        remoteAudioRef.current.pause();\n        remoteAudioRef.current.srcObject = null;\n      } catch {}\n    }\n\n    setVoiceState("idle");',
              'persistent remote audio cleanup',
          )

          replace_once(
              '''      const AudioContextClass = window.AudioContext;
      const meterContext = new AudioContextClass();
      meterContextRef.current = meterContext;
      const analyser = meterContext.createAnalyser();
      analyser.fftSize = 256;
      meterContext.createMediaStreamSource(stream).connect(analyser);
      const samples = new Uint8Array(analyser.frequencyBinCount);
      const updateMeter = () => {
        analyser.getByteFrequencyData(samples);
        const average = samples.reduce((sum, sample) => sum + sample, 0) / samples.length;
        setVoiceLevel(Math.min(1, average / 72));
        meterFrameRef.current = requestAnimationFrame(updateMeter);
      };
      updateMeter();

''',
              '',
              'AudioContext meter block',
          )

          replace_once(
              '''      const remoteAudio = new Audio();
      remoteAudio.autoplay = true;
      remoteAudio.setAttribute("playsinline", "");
      remoteAudioRef.current = remoteAudio;

      peer.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0] || new MediaStream([event.track]);
        void remoteAudio.play().catch(() => {});
      };
''',
              '''      // Keep one real DOM <audio> element for the whole voice session. On iOS
      // Safari this is more stable than creating a detached audio object while
      // getUserMedia/WebRTC is also active.
      const remoteAudio = remoteAudioRef.current;
      if (!remoteAudio) throw new Error("VOICE_AUDIO_ELEMENT_MISSING");
      remoteAudio.autoplay = true;
      remoteAudio.setAttribute("playsinline", "");
      remoteAudio.onplaying = () => {
        console.debug("[assistant/realtime/audio] playing");
      };
      remoteAudio.onpause = () => {
        if (voiceSpeakingRef.current) {
          console.warn("[assistant/realtime/audio] paused while response audio was active");
        }
      };
      remoteAudio.onwaiting = () => {
        console.warn("[assistant/realtime/audio] waiting for remote audio");
      };
      remoteAudio.onstalled = () => {
        console.warn("[assistant/realtime/audio] stalled");
      };
      remoteAudio.onerror = () => {
        console.error("[assistant/realtime/audio] media element error", remoteAudio.error?.code);
      };

      peer.ontrack = (event) => {
        remoteAudio.srcObject = event.streams[0] || new MediaStream([event.track]);
        void remoteAudio.play().catch((error) => {
          console.error("[assistant/realtime/audio] play failed", error);
          setVoiceError("Die Audioausgabe wurde von Safari unterbrochen. Bitte starte den Sprachchat erneut.");
        });
      };
''',
              'persistent DOM audio block',
          )

          replace_once(
              '''        if (event?.type === "input_audio_buffer.speech_started") {
          armVoiceIdleStop();
          setVoiceState("listening");
          return;
        }

        if (event?.type === "input_audio_buffer.speech_stopped") {
          armVoiceIdleStop();
          setVoiceState("thinking");
          return;
        }

        if (event?.type === "output_audio_buffer.started") {
          armVoiceIdleStop();
          setVoiceState("speaking");
          return;
        }

        if (event?.type === "output_audio_buffer.stopped") {
          armVoiceIdleStop();
          if (pendingVoiceCheckoutRef.current) {
            pendingVoiceCheckoutRef.current = false;
            window.setTimeout(() => {
              stopVoice();
              setOpen(false);
              router.push("/checkout");
            }, 120);
          } else {
            setVoiceState("listening");
          }
          return;
        }
''',
              '''        if (event?.type === "input_audio_buffer.speech_started") {
          armVoiceIdleStop();
          // With interrupt_response=false, echo/background speech while the AI is
          // talking must not steal the playback turn.
          if (!voiceSpeakingRef.current) setVoiceState("listening");
          return;
        }

        if (event?.type === "input_audio_buffer.speech_stopped") {
          armVoiceIdleStop();
          if (!voiceSpeakingRef.current) setVoiceState("thinking");
          return;
        }

        if (event?.type === "output_audio_buffer.started") {
          armVoiceIdleStop();
          voiceSpeakingRef.current = true;
          setVoiceState("speaking");
          return;
        }

        if (event?.type === "output_audio_buffer.cleared") {
          console.warn("[assistant/realtime] output audio buffer cleared", {
            responseId: cleanString(event?.response_id),
          });
          voiceSpeakingRef.current = false;
          armVoiceIdleStop();
          setVoiceState("listening");
          return;
        }

        if (event?.type === "output_audio_buffer.stopped") {
          armVoiceIdleStop();
          voiceSpeakingRef.current = false;
          if (pendingVoiceCheckoutRef.current) {
            pendingVoiceCheckoutRef.current = false;
            window.setTimeout(() => {
              stopVoice();
              setOpen(false);
              router.push("/checkout");
            }, 120);
          } else {
            setVoiceState("listening");
          }
          return;
        }

        if (event?.type === "response.done") {
          const response = event?.response || {};
          const status = cleanString(response?.status);
          const statusDetails = response?.status_details || response?.incomplete_details || null;
          const outputCount = Array.isArray(response?.output) ? response.output.length : 0;
          if (status && status !== "completed") {
            console.warn("[assistant/realtime] response.done non-completed", {
              responseId: cleanString(response?.id),
              status,
              statusDetails,
              outputCount,
            });
          } else {
            console.debug("[assistant/realtime] response.done", {
              responseId: cleanString(response?.id),
              status: status || "completed",
              outputCount,
            });
          }
          return;
        }
''',
              'realtime event state block',
          )

          dialog = '''        <div
          className="fixed inset-0 z-[100] h-[100dvh] overflow-hidden bg-[#050403] text-white"
          role="dialog"
          aria-modal="true"
          aria-label="Burger Brothers AI"
        >
'''
          replace_once(
              dialog,
              dialog + '''          <audio
            ref={remoteAudioRef}
            autoPlay
            aria-hidden="true"
          />
''',
              'persistent audio element',
          )

          replace_once(
              '''                    className={`bb-voice-orb bb-voice-orb--${voiceState} ${voiceConfirmation ? "bb-voice-orb--success" : ""}`}
                    style={{ "--voice-level": voiceLevel } as React.CSSProperties}
                    aria-hidden="true"''',
              '''                    className={`bb-voice-orb bb-voice-orb--${voiceState} ${voiceConfirmation ? "bb-voice-orb--success" : ""}`}
                    aria-hidden="true"''',
              'orb voice level style',
          )
          replace_once(
              '.bb-voice-orb { --voice-level: 0; position: relative;',
              '.bb-voice-orb { position: relative;',
              'orb css variable',
          )
          replace_once(
              '.bb-voice-orb--listening { transform: scale(calc(1 + var(--voice-level) * .045)); }',
              '.bb-voice-orb--listening { animation-duration: 4.2s; }',
              'orb listening meter transform',
          )

          p.write_text(s)

          t = Path('tools/assistant-realtime-v2-tests.cjs')
          ts = t.read_text()
          if 'const component = fs.readFileSync("components/assistant/BurgerAssistant.tsx", "utf8");' not in ts:
              ts = ts.replace(
                  'const route = fs.readFileSync("app/api/assistant/realtime/route.ts", "utf8");',
                  'const route = fs.readFileSync("app/api/assistant/realtime/route.ts", "utf8");\nconst component = fs.readFileSync("components/assistant/BurgerAssistant.tsx", "utf8");',
              )
          marker = 'assert.match(route, /Never verbally confirm a removal or customization unless/s);\n'
          checks = '''
assert.doesNotMatch(component, /const\\s+remoteAudio\\s*=\\s*new Audio\\(/);
assert.doesNotMatch(component, /createAnalyser|createMediaStreamSource|setVoiceLevel|meterContextRef|meterFrameRef/);
assert.match(component, /<audio[\\s\\S]*ref=\\{remoteAudioRef\\}[\\s\\S]*autoPlay/);
assert.match(component, /const remoteAudio = remoteAudioRef\\.current/);
assert.match(component, /output_audio_buffer\\.cleared/);
assert.match(component, /event\\?\\.type === "response\\.done"/);
assert.match(component, /response\\.done non-completed/);
assert.match(component, /voiceSpeakingRef\\.current/);
assert.match(component, /if \\(!voiceSpeakingRef\\.current\\) setVoiceState\\("listening"\\)/);
'''
          if checks.strip() not in ts:
              if marker not in ts:
                  raise SystemExit('test insertion marker missing')
              ts = ts.replace(marker, marker + checks, 1)
          t.write_text(ts)
          PY

      - name: Run focused regression checks
        run: |
          node tools/assistant-realtime-v2-tests.cjs
          git diff --check

      - name: Commit patch to PR branch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/assistant/BurgerAssistant.tsx tools/assistant-realtime-v2-tests.cjs
          git commit -m "fix(ai): stabilize iPhone realtime audio playback"
          git push origin HEAD:fix/ai-v2-natural-realtime
