name: Burger Studio Integration

# One-shot branch integration workflow.
on:
  push:
    branches: [codex/burger-studio-v1]
    paths:
      - "scripts/apply-burger-studio.py"
      - ".github/workflows/burger-studio-apply.yml"

permissions:
  contents: write

concurrency:
  group: burger-studio-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/burger-studio-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply integration patch
        run: python3 scripts/apply-burger-studio.py
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
      - name: Commit integration
        if: success()
        run: |
          rm -f scripts/apply-burger-studio.py
          rm -f .github/workflows/burger-studio-apply.yml
          git config user.name "burger-brothers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
            exit 0
          fi
          git commit -m "feat: integrate Burger Studio ordering flow"
          git push origin HEAD:codex/burger-studio-v1
