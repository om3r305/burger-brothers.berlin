name: One-shot client pricing parity

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-client-pricing-parity.yml

permissions:
  contents: write

concurrency:
  group: one-shot-client-pricing-parity
  cancel-in-progress: false

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply client pricing parity patch
        run: node tools/one-shot-client-pricing-parity.cjs

      - name: Verify canonical and client pricing
        run: npm run pricing:test

      - name: Verify checkout safety regression suite
        run: npm run checkout:safety:test

      - name: Typecheck
        run: npm run typecheck

      - name: Remove one-shot tooling
        run: |
          rm -f tools/one-shot-client-pricing-parity.cjs
          rm -f .github/workflows/one-shot-client-pricing-parity.yml

      - name: Commit verified pricing fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 1
          fi
          git commit -m "fix(pricing): align client totals with canonical server"
          git push origin HEAD:main
