name: iOS 3 Apps CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-ci.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Main
            dir: ios/BurgerBrothersMain
            project: BurgerBrothersMain.xcodeproj
            scheme: BurgerBrothersMain
          - name: Schnell
            dir: ios/BurgerBrothersSchnell
            project: BurgerBrothersSchnell.xcodeproj
            scheme: BurgerBrothersSchnell
          - name: Driver
            dir: ios/BurgerBrothersDriver
            project: BurgerBrothersDriver.xcodeproj
            scheme: BurgerBrothersDriver

    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        working-directory: ${{ matrix.dir }}
        run: xcodegen generate

      - name: Build without signing
        working-directory: ${{ matrix.dir }}
        run: |
          set -o pipefail
          xcodebuild             -project "${{ matrix.project }}"             -scheme "${{ matrix.scheme }}"             -configuration Release             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             -derivedDataPath build             build

      # App Store Connect rejects bundles without these; XcodeGen once
      # silently replaced the hand-written Info.plist, so check the built app.
      - name: Verify built Info.plist
        working-directory: ${{ matrix.dir }}
        run: |
          set -euo pipefail
          APP="$(find build/Build/Products -maxdepth 2 -name '*.app' -print -quit)"
          PLIST="$APP/Info.plist"
          for key in UILaunchScreen UISupportedInterfaceOrientations NSMicrophoneUsageDescription NSCameraUsageDescription ITSAppUsesNonExemptEncryption; do
            plutil -extract "$key" raw -o - "$PLIST" >/dev/null 2>&1 || plutil -extract "$key" xml1 -o - "$PLIST" >/dev/null || { echo "::error::$key missing in $PLIST"; exit 1; }
          done
          FAMILY="$(plutil -extract UIDeviceFamily json -o - "$PLIST")"
          [ "$FAMILY" = "[1]" ] || { echo "::error::UIDeviceFamily is $FAMILY, expected iPhone only"; exit 1; }
          echo "Info.plist OK: $(plutil -extract CFBundleIdentifier raw -o - "$PLIST")"
