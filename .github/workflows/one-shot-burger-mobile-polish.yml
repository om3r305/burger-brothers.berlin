name: One-shot Burger Studio mobile polish

on:
  push:
    branches:
      - "fix/burger-studio-mobile-labels-cheese-melt"
    paths:
      - ".github/workflows/one-shot-burger-mobile-polish.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "fix/burger-studio-mobile-labels-cheese-melt"
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python tools/one-shot-burger-mobile-polish.py

      - name: Install dependencies
        run: npm ci

      - name: Test Burger Studio
        run: |
          node tools/burger-studio-mobile-assembly-regression-tests.cjs
          node tools/burger-studio-appetite-pro-regression-tests.cjs
          node tools/burger-studio-final-stack-regression-tests.cjs

      - name: Typecheck
        run: npm run typecheck

      - name: Commit final branch
        run: |
          git diff --check
          rm .github/workflows/one-shot-burger-mobile-polish.yml
          rm tools/one-shot-burger-mobile-polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(burger-studio): restore mobile labels and slow cheese melt"
          git push origin HEAD:fix/burger-studio-mobile-labels-cheese-melt
