name: Fix admin mobile decimal inputs

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-admin-mobile-decimals.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch localized discount inputs safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/admin/settings/page.tsx")
          text = path.read_text(encoding="utf-8")

          old_num = '''function num(value: any, fallback = 0) {
            const n = Number(value);
            return Number.isFinite(n) ? n : fallback;
          }'''
          new_num = '''function num(value: any, fallback = 0) {
            const normalized =
              typeof value === "string" ? value.trim().replace(",", ".") : value;
            const n = Number(normalized);
            return Number.isFinite(n) ? n : fallback;
          }'''

          old_lifa = '''            <Field label="Rabatt Lifa / Lieferung (0.10 = 10%)">
                        <input
                          type="number"
                          step="0.01"
                          className="w-full rounded-md border border-stone-700/60 bg-stone-950 px-3 py-2 outline-none"
                          value={String(m.delivery?.discountRate ?? 0)}
                          onChange={(event) => {
                            const value = Number(event.target.value || 0);
                            setNested(["delivery", "discountRate"], value);
                            setNested(["discount", "lifaRate"], value);
                            setNested(["discounts", "deliveryPercent"], value);
                            setNested(["discounts", "lifaPercent"], value);
                          }}
                        />
                      </Field>'''
          new_lifa = '''            <Field label="Rabatt Lifa / Lieferung (0,10 = 10%)">
                        <input
                          type="text"
                          inputMode="decimal"
                          autoComplete="off"
                          className="w-full rounded-md border border-stone-700/60 bg-stone-950 px-3 py-2 outline-none"
                          value={String(m.delivery?.discountRate ?? 0).replace(".", ",")}
                          onChange={(event) => {
                            const value = event.target.value.replace(".", ",");
                            if (!/^\\d*(?:,\\d*)?$/.test(value)) return;
                            setNested(["delivery", "discountRate"], value);
                            setNested(["discount", "lifaRate"], value);
                            setNested(["discounts", "deliveryPercent"], value);
                            setNested(["discounts", "lifaPercent"], value);
                          }}
                        />
                      </Field>'''

          old_apollon = '''            <Field label="Rabatt Apollon / Abholung (0.10 = 10%)">
                        <input
                          type="number"
                          step="0.01"
                          className="w-full rounded-md border border-stone-700/60 bg-stone-950 px-3 py-2 outline-none"
                          value={String(m.pickup?.discountRate ?? 0)}
                          onChange={(event) => {
                            const value = Number(event.target.value || 0);
                            setNested(["pickup", "discountRate"], value);
                            setNested(["discount", "apollonRate"], value);
                            setNested(["discounts", "pickupPercent"], value);
                            setNested(["discounts", "apolloPercent"], value);
                          }}
                        />
                      </Field>'''
          new_apollon = '''            <Field label="Rabatt Apollon / Abholung (0,10 = 10%)">
                        <input
                          type="text"
                          inputMode="decimal"
                          autoComplete="off"
                          className="w-full rounded-md border border-stone-700/60 bg-stone-950 px-3 py-2 outline-none"
                          value={String(m.pickup?.discountRate ?? 0).replace(".", ",")}
                          onChange={(event) => {
                            const value = event.target.value.replace(".", ",");
                            if (!/^\\d*(?:,\\d*)?$/.test(value)) return;
                            setNested(["pickup", "discountRate"], value);
                            setNested(["discount", "apollonRate"], value);
                            setNested(["discounts", "pickupPercent"], value);
                            setNested(["discounts", "apolloPercent"], value);
                          }}
                        />
                      </Field>'''

          replacements = [
              (old_num, new_num, "num helper"),
              (old_lifa, new_lifa, "Lifa discount input"),
              (old_apollon, new_apollon, "Apollon discount input"),
          ]

          for old, new, label in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} block, found {count}; refusing partial patch")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verify diff
        run: |
          git diff --check
          git diff -- app/admin/settings/page.tsx

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/settings/page.tsx
          git commit -m "fix(admin): support mobile decimal discount input"
          git push origin HEAD:main
