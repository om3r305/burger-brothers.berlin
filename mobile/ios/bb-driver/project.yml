name: BBDriverApp
options:
  bundleIdPrefix: berlin.burgerbrothers
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  BBDriverApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: Config/Info.plist
    entitlements:
      path: Config/App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: berlin.burgerbrothers.driver
        PRODUCT_NAME: "BB Driver"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
