name: BurgerBrothersSchnell
options:
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "26.0"

settings:
  base:
    PRODUCT_NAME: "Burger Brothers Schnell"
    PRODUCT_BUNDLE_IDENTIFIER: berlin.burgerbrothers.ios.schnell
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: App/Info.plist
    CODE_SIGN_ENTITLEMENTS: App/App.entitlements

targets:
  BurgerBrothersSchnell:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - App.entitlements
    # Info.plist and entitlements are hand-written files. XcodeGen's `info:` /
    # `entitlements:` blocks would regenerate (overwrite) them with defaults,
    # so they are only referenced through build settings here. Target-level
    # values also override XcodeGen's iOS preset (TARGETED_DEVICE_FAMILY 1,2).
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        TARGETED_DEVICE_FAMILY: "1"
